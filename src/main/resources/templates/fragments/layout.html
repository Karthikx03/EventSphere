<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · EventSphere'">EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark es-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-stars me-1"></i>EventSphere</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/events}">Browse events</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/bookings}">My tickets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Log in</a>
                <a class="btn btn-accent btn-sm" th:href="@{/register}">Sign up</a>
            </div>
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-white-50 small"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="container mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${success}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<th:block th:fragment="footer">
    <footer class="es-footer mt-5 py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
            <span>&copy; EventSphere · Campus Event Management System</span>
            <span>Built with Spring Boot, Spring Security, Spring Data JPA &amp; Thymeleaf</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

<!-- Reusable event card -->
<div th:fragment="eventCard(e)" class="card es-card h-100">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge es-badge" th:classappend="'cat-' + ${#strings.toLowerCase(e.category.name())}"
                  th:text="${e.category.displayName}">Tech</span>
            <span class="es-price" th:text="${e.free} ? 'Free' : ${currency} + ${#numbers.formatDecimal(e.price, 1, 2)}">Free</span>
        </div>
        <h5 class="card-title fw-bold" th:text="${e.title}">Event title</h5>
        <p class="text-muted small mb-1"><i class="bi bi-calendar-event me-1"></i>
            <span th:text="${#temporals.format(e.startTime, 'EEE, dd MMM yyyy · hh:mm a')}">Date</span></p>
        <p class="text-muted small"><i class="bi bi-geo-alt me-1"></i><span th:text="${e.venue}">Venue</span></p>
        <div class="mt-auto">
            <div class="progress es-progress mb-1" role="progressbar" th:aria-valuenow="${e.occupancyPercent}"
                 aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" th:style="'width:' + ${e.occupancyPercent} + '%'"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <small th:if="${!e.soldOut}" class="text-muted" th:text="${e.availableSeats} + ' of ' + ${e.capacity} + ' seats left'">seats</small>
                <small th:if="${e.soldOut}" class="text-danger fw-semibold">Sold out</small>
                <a th:href="@{/events/{id}(id=${e.id})}" class="btn btn-sm btn-primary">View</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
