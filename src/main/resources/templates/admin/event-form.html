<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${eventId == null} ? 'New event' : 'Edit event')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mt-4">
    <a th:href="@{/admin}" class="small"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <div class="row justify-content-center mt-2">
        <div class="col-lg-8">
            <div class="card es-form-card">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-4" th:text="${eventId == null} ? 'Create a new event' : 'Edit event'">Event</h1>

                    <form th:action="${eventId == null} ? @{/admin/events} : @{/admin/events/{id}(id=${eventId})}"
                          th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea th:field="*{description}" rows="4" class="form-control" th:errorclass="is-invalid"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label">Category</label>
                                <select th:field="*{category}" class="form-select" th:errorclass="is-invalid">
                                    <option value="">Choose…</option>
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}">cat</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{category}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="venue" class="form-label">Venue</label>
                                <input type="text" th:field="*{venue}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{venue}"></div>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-5">
                                <label for="startTime" class="form-label">Starts at</label>
                                <input type="datetime-local" th:field="*{startTime}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{startTime}"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="capacity" class="form-label">Capacity</label>
                                <input type="number" min="1" th:field="*{capacity}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{capacity}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="price" class="form-label">Price (<span th:text="${currency}">Rs.</span>)</label>
                                <input type="number" min="0" step="0.01" th:field="*{price}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" th:text="${eventId == null} ? 'Create event' : 'Save changes'">Save</button>
                        <a th:href="@{/admin}" class="btn btn-link">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
