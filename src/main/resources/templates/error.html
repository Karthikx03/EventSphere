<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container text-center py-5">
    <div class="display-1 fw-bold text-muted" th:text="${status} ?: 'Oops'">500</div>
    <p class="lead" th:text="${status == 403} ? 'You do not have permission to view this page.' : 'Something went wrong.'">Error</p>
    <a th:href="@{/}" class="btn btn-primary">Go home</a>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
