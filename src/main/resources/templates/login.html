<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
    <div class="row justify-content-center mt-4">
        <div class="col-md-6 col-lg-5">
            <div class="card es-form-card">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-1">Welcome back</h1>
                    <p class="text-muted mb-4">Log in to book events and see your tickets.</p>

                    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
                    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log in</button>
                    </form>
                    <p class="text-center small mt-3 mb-0">New here? <a th:href="@{/register}">Create an account</a></p>
                </div>
            </div>
            <div th:if="${showDemoAccounts}" class="es-demo small mt-3">
                <strong>Demo accounts</strong><br>
                Admin: admin@eventsphere.com / admin123<br>
                Student: student@eventsphere.com / student123
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
