<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign up')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-7 col-lg-5">
            <div class="card es-form-card">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-1">Create your account</h1>
                    <p class="text-muted mb-4">It takes less than a minute.</p>

                    <form th:action="@{/register}" th:object="${form}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="m-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">error</p>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full name</label>
                            <input type="text" th:field="*{fullName}" required maxlength="80" autocomplete="name" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" th:field="*{email}" required maxlength="120" autocomplete="email" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" th:field="*{password}" required minlength="6" maxlength="64" autocomplete="new-password" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                            <div class="form-text" th:unless="${#fields.hasErrors('password')}">At least 6 characters.</div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm password</label>
                            <input type="password" th:field="*{confirmPassword}" required minlength="6" maxlength="64" autocomplete="new-password" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign up</button>
                    </form>
                    <p class="text-center small mt-3 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
