<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container mt-3">
    <h1 class="h3 fw-bold">Upcoming events</h1>

    <form th:action="@{/events}" method="get" class="row g-2 my-3">
        <div class="col-md-6">
            <input type="search" name="q" th:value="${q}" class="form-control" placeholder="Search by title or venue">
        </div>
        <div class="col-md-4">
            <select name="category" class="form-select">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}"
                        th:selected="${c == selectedCategory}">Category</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Search</button>
        </div>
    </form>

    <p class="text-muted small" th:text="${#lists.size(events)} + ' event(s) found'">0 events</p>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="e : ${events}">
            <div th:replace="~{fragments/layout :: eventCard(${e})}"></div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="es-empty text-center py-5">
        <i class="bi bi-calendar-x display-5 text-muted"></i>
        <p class="mt-3 mb-1 fw-semibold">No events match your search.</p>
        <a th:href="@{/events}">Clear filters</a>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
