spring.application.name=EventSphere
server.port=8080

# ---- Database (H2 in-memory by default: zero setup) --------------------------
# Run with --spring.profiles.active=mysql to use MySQL instead (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:eventsphere;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:eventsphere)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Thymeleaf ---------------------------------------------------------------
spring.thymeleaf.cache=false

# ---- App settings ------------------------------------------------------------
# Currency shown next to prices. Defaults to the Indian Rupee sign; uncomment to change.
# app.currency-symbol=$
