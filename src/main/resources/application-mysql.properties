# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Credentials come from environment variables so they never end up in Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsphere?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
